[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy: restrict script sources to self only (index.html uses inline scripts with 'unsafe-inline' for now)
    # TODO: Migrate inline scripts to external files and use nonce-based CSP
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.wave.com https://fonts.googleapis.com"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS protection in older browsers
    X-XSS-Protection = "1; mode=block"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy (formerly Feature-Policy)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
